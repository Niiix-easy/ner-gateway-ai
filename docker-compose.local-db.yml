# MySQL + Redis para desenvolvimento local (PHP no Laragon no host).
#
# Subir: docker compose -f docker-compose.local-db.yml up -d
# Parar: docker compose -f docker-compose.local-db.yml down
#
# No .env do Laragon (host):
#   DB_CONNECTION=mysql
#   DB_HOST=127.0.0.1
#   DB_PORT=3307
#   DB_DATABASE=platform
#   DB_USERNAME=platform
#   DB_PASSWORD=platform
#   REDIS_HOST=127.0.0.1
#   REDIS_PORT=6379
#
# Portas no host (evita conflito com MySQL/Redis do Laragon/Windows):
# - MySQL: 3307 -> 3306 no container (LOCALDB_MYSQL_PORT)
# - Redis: 6379 (LOCALDB_REDIS_PORT)
#
# Postgres opcional (perfil "postgres"):
#   docker compose -f docker-compose.local-db.yml --profile postgres up -d

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${LOCALDB_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${LOCALDB_MYSQL_DATABASE:-platform}
      MYSQL_USER: ${LOCALDB_MYSQL_USER:-platform}
      MYSQL_PASSWORD: ${LOCALDB_MYSQL_PASSWORD:-platform}
      MYSQL_ROOT_PASSWORD: ${LOCALDB_MYSQL_ROOT_PASSWORD:-platformroot}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - localdb_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pplatformroot"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 25s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${LOCALDB_REDIS_PORT:-6379}:6379"
    command:
      - "redis-server"
      - "--maxmemory"
      - "${LOCALDB_REDIS_MAXMEMORY:-128mb}"
      - "--maxmemory-policy"
      - "${LOCALDB_REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${LOCALDB_PG_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${LOCALDB_POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${LOCALDB_POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${LOCALDB_POSTGRES_DB:-platform}
    volumes:
      - localdb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  localdb_mysql_data:
    driver: local
  localdb_postgres_data:
    driver: local
