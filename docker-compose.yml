services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: platform_app:latest
    restart: unless-stopped
    ports:
      - "${PLATFORM_HTTP_PORT:-80}:80"
    volumes:
      - platform_storage:/var/www/html/storage
      - platform_plugins:/var/www/html/plugins
      - platform_env:/var/www/html/.docker
    environment:
      APP_ENV: ${PLATFORM_APP_ENV:-production}
      APP_DEBUG: ${PLATFORM_APP_DEBUG:-false}
      PLATFORM_APP_URL: ${PLATFORM_APP_URL:-http://localhost}
      PLATFORM_WEBHOOK_PUBLIC_URL: ${PLATFORM_WEBHOOK_PUBLIC_URL:-}
      PORT: "80"
      APP_INSTALLED: ${PLATFORM_APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${PLATFORM_APP_AUTO_MIGRATE:-false}
      DB_CONNECTION: ${PLATFORM_DB_CONNECTION:-pgsql}
      DB_HOST: ${PLATFORM_DB_HOST:-postgres}
      DB_PORT: ${PLATFORM_DB_PORT:-5432}
      DB_DATABASE: ${PLATFORM_DB_DATABASE:-platform}
      DB_USERNAME: ${PLATFORM_DB_USERNAME:-platform}
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
      REDIS_HOST: ${PLATFORM_REDIS_HOST:-redis}
      REDIS_PORT: ${PLATFORM_REDIS_PORT:-6379}
      CACHE_STORE: ${PLATFORM_CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${PLATFORM_QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${PLATFORM_SESSION_DRIVER:-file}
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "true"
      API_INBOUND_WEBHOOKS_ASYNC: ${API_INBOUND_WEBHOOKS_ASYNC:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLATFORM_DB_DATABASE:-platform}
      POSTGRES_USER: ${PLATFORM_DB_USERNAME:-platform}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - "redis-server"
      - "--maxmemory"
      - "${PLATFORM_REDIS_MAXMEMORY:-512mb}"
      - "--maxmemory-policy"
      - "${PLATFORM_REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  scheduler:
    image: platform_app:latest
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - platform_storage:/var/www/html/storage
      - platform_plugins:/var/www/html/plugins
      - platform_env:/var/www/html/.docker
    environment:
      APP_ENV: ${PLATFORM_APP_ENV:-production}
      DB_CONNECTION: ${PLATFORM_DB_CONNECTION:-pgsql}
      DB_HOST: ${PLATFORM_DB_HOST:-postgres}
      DB_PORT: ${PLATFORM_DB_PORT:-5432}
      DB_DATABASE: ${PLATFORM_DB_DATABASE:-platform}
      DB_USERNAME: ${PLATFORM_DB_USERNAME:-platform}
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
      REDIS_HOST: ${PLATFORM_REDIS_HOST:-redis}
      REDIS_PORT: ${PLATFORM_REDIS_PORT:-6379}
      CACHE_STORE: ${PLATFORM_CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${PLATFORM_QUEUE_CONNECTION:-redis}
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-payments:
    image: platform_app:latest
    restart: unless-stopped
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=payments,default"
      - "--sleep=3"
      - "--tries=3"
      - "--timeout=120"
      - "--memory=${PLATFORM_QUEUE_WORKER_MEMORY:-256}"
      - "--max-time=${PLATFORM_QUEUE_WORKER_MAX_TIME:-3600}"
    volumes:
      - platform_storage:/var/www/html/storage
      - platform_plugins:/var/www/html/plugins
      - platform_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${PLATFORM_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${PLATFORM_REDIS_HOST:-redis}
      DB_CONNECTION: ${PLATFORM_DB_CONNECTION:-pgsql}
      DB_HOST: ${PLATFORM_DB_HOST:-postgres}
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
    depends_on:
      redis:
        condition: service_healthy

  worker-webhooks-out:
    image: platform_app:latest
    restart: unless-stopped
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=webhooks-outbound,webhooks"
      - "--sleep=2"
      - "--tries=3"
      - "--timeout=60"
    volumes:
      - platform_storage:/var/www/html/storage
      - platform_plugins:/var/www/html/plugins
      - platform_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${PLATFORM_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${PLATFORM_REDIS_HOST:-redis}
      DB_CONNECTION: ${PLATFORM_DB_CONNECTION:-pgsql}
      DB_HOST: ${PLATFORM_DB_HOST:-postgres}
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
    depends_on:
      redis:
        condition: service_healthy

  worker-webhooks-in:
    image: platform_app:latest
    restart: unless-stopped
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=webhooks-inbound"
      - "--sleep=1"
      - "--tries=3"
      - "--timeout=120"
    volumes:
      - platform_storage:/var/www/html/storage
      - platform_plugins:/var/www/html/plugins
      - platform_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${PLATFORM_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${PLATFORM_REDIS_HOST:-redis}
      API_INBOUND_WEBHOOKS_ASYNC: "true"
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
    depends_on:
      redis:
        condition: service_healthy

  worker-payouts:
    image: platform_app:latest
    restart: unless-stopped
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=payouts"
      - "--sleep=3"
      - "--tries=3"
      - "--timeout=120"
    volumes:
      - platform_storage:/var/www/html/storage
      - platform_plugins:/var/www/html/plugins
      - platform_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${PLATFORM_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${PLATFORM_REDIS_HOST:-redis}
      DB_CONNECTION: ${PLATFORM_DB_CONNECTION:-pgsql}
      DB_HOST: ${PLATFORM_DB_HOST:-postgres}
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
    depends_on:
      redis:
        condition: service_healthy

  worker-meta-tracking:
    image: platform_app:latest
    restart: unless-stopped
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=meta-tracking"
      - "--sleep=1"
      - "--tries=8"
      - "--timeout=60"
    volumes:
      - platform_storage:/var/www/html/storage
      - platform_plugins:/var/www/html/plugins
      - platform_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${PLATFORM_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${PLATFORM_REDIS_HOST:-redis}
      DB_CONNECTION: ${PLATFORM_DB_CONNECTION:-pgsql}
      DB_HOST: ${PLATFORM_DB_HOST:-postgres}
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
    depends_on:
      redis:
        condition: service_healthy

  worker-utmify-tracking:
    image: platform_app:latest
    restart: unless-stopped
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=utmify-tracking"
      - "--sleep=1"
      - "--tries=10"
      - "--timeout=60"
    volumes:
      - platform_storage:/var/www/html/storage
      - platform_plugins:/var/www/html/plugins
      - platform_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${PLATFORM_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${PLATFORM_REDIS_HOST:-redis}
      DB_CONNECTION: ${PLATFORM_DB_CONNECTION:-pgsql}
      DB_HOST: ${PLATFORM_DB_HOST:-postgres}
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
    depends_on:
      redis:
        condition: service_healthy

  worker-integrax-sms:
    image: platform_app:latest
    restart: unless-stopped
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=integrax-sms"
      - "--sleep=1"
      - "--tries=5"
      - "--timeout=60"
    volumes:
      - platform_storage:/var/www/html/storage
      - platform_plugins:/var/www/html/plugins
      - platform_env:/var/www/html/.docker
    environment:
      QUEUE_CONNECTION: ${PLATFORM_QUEUE_CONNECTION:-redis}
      REDIS_HOST: ${PLATFORM_REDIS_HOST:-redis}
      DB_CONNECTION: ${PLATFORM_DB_CONNECTION:-pgsql}
      DB_HOST: ${PLATFORM_DB_HOST:-postgres}
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  platform_storage:
    driver: local
  platform_plugins:
    driver: local
  platform_env:
    driver: local
