# Desenvolvimento local do gateway (app + Postgres/Redis).
# Uso (recomendado — um comando):
#   docker compose -f docker-compose.local-db.yml -f docker-compose.dev.yml up --build
#
# Postgres no host: localhost:5433 | Redis no host: localhost:6379
# Dentro da rede Docker use os serviços postgres:5432 e redis:6379 (mais rápido que host.docker.internal).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: platform_app:dev
    restart: unless-stopped
    ports:
      - "${PLATFORM_HTTP_PORT:-8085}:80"
    volumes:
      - .:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/99-uploads.ini:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      PLATFORM_APP_URL: ${PLATFORM_APP_URL:-http://localhost:8085}
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
      DB_CONNECTION: pgsql
      DB_HOST: ${PLATFORM_DEV_DB_HOST:-postgres}
      DB_PORT: ${PLATFORM_DEV_DB_PORT:-5432}
      DB_DATABASE: ${LOCALDB_POSTGRES_DB:-platform}
      DB_USERNAME: ${LOCALDB_POSTGRES_USER:-platform}
      DB_PASSWORD: ${LOCALDB_POSTGRES_PASSWORD:-platform}
      REDIS_HOST: ${PLATFORM_DEV_REDIS_HOST:-redis}
      REDIS_PORT: ${PLATFORM_DEV_REDIS_PORT:-6379}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "false"
      LICENSE_DISABLED: ${LICENSE_DISABLED:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: platform_app:dev
    restart: unless-stopped
    command:
      - "php"
      - "artisan"
      - "queue:work"
      - "--queue=integrax-sms,utmify-tracking,webhooks-outbound,webhooks-inbound,payments,default"
      - "--sleep=2"
      - "--tries=3"
      - "--timeout=120"
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
      DB_CONNECTION: pgsql
      DB_HOST: ${PLATFORM_DEV_DB_HOST:-postgres}
      DB_PORT: ${PLATFORM_DEV_DB_PORT:-5432}
      DB_DATABASE: ${LOCALDB_POSTGRES_DB:-platform}
      DB_USERNAME: ${LOCALDB_POSTGRES_USER:-platform}
      DB_PASSWORD: ${LOCALDB_POSTGRES_PASSWORD:-platform}
      REDIS_HOST: ${PLATFORM_DEV_REDIS_HOST:-redis}
      REDIS_PORT: ${PLATFORM_DEV_REDIS_PORT:-6379}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started

  scheduler:
    image: platform_app:dev
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_ENV: local
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
      DB_CONNECTION: pgsql
      DB_HOST: ${PLATFORM_DEV_DB_HOST:-postgres}
      DB_PORT: ${PLATFORM_DEV_DB_PORT:-5432}
      DB_DATABASE: ${LOCALDB_POSTGRES_DB:-platform}
      DB_USERNAME: ${LOCALDB_POSTGRES_USER:-platform}
      DB_PASSWORD: ${LOCALDB_POSTGRES_PASSWORD:-platform}
      REDIS_HOST: ${PLATFORM_DEV_REDIS_HOST:-redis}
      REDIS_PORT: ${PLATFORM_DEV_REDIS_PORT:-6379}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
