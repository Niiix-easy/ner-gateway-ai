services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: platform_app:latest
    restart: unless-stopped
    ports:
      - "${PLATFORM_HTTP_PORT:-80}:80"
    volumes:
      - platform_storage:/var/www/html/storage
      - platform_plugins:/var/www/html/plugins
      - platform_env:/var/www/html/.docker
    environment:
      APP_ENV: ${PLATFORM_APP_ENV:-production}
      APP_DEBUG: ${PLATFORM_APP_DEBUG:-false}
      PLATFORM_APP_URL: ${PLATFORM_APP_URL:-http://localhost}
      PLATFORM_WEBHOOK_PUBLIC_URL: ${PLATFORM_WEBHOOK_PUBLIC_URL:-}
      PORT: "80"
      APP_INSTALLED: ${PLATFORM_APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${PLATFORM_APP_AUTO_MIGRATE:-false}
      DB_CONNECTION: ${PLATFORM_DB_CONNECTION:-pgsql}
      DB_HOST: ${PLATFORM_DB_HOST:-postgres}
      DB_PORT: ${PLATFORM_DB_PORT:-5432}
      DB_DATABASE: ${PLATFORM_DB_DATABASE:-platform}
      DB_USERNAME: ${PLATFORM_DB_USERNAME:-platform}
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
      CACHE_STORE: ${PLATFORM_CACHE_STORE:-file}
      QUEUE_CONNECTION: ${PLATFORM_QUEUE_CONNECTION:-database}
      SESSION_DRIVER: ${PLATFORM_SESSION_DRIVER:-file}
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "true"
      API_INBOUND_WEBHOOKS_ASYNC: ${API_INBOUND_WEBHOOKS_ASYNC:-true}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLATFORM_DB_DATABASE:-platform}
      POSTGRES_USER: ${PLATFORM_DB_USERNAME:-platform}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30

  queue:
    image: platform_app:latest
    restart: unless-stopped
    command:
      - "sh"
      - "-lc"
      - "set -e; php artisan queue:work --queue=payments,webhooks-outbound,webhooks-inbound,webhooks,payouts,meta-tracking,utmify-tracking,default --sleep=3 --tries=3 --timeout=0 --memory=${PLATFORM_QUEUE_WORKER_MEMORY:-128} --max-time=${PLATFORM_QUEUE_WORKER_MAX_TIME:-3600} --max-jobs=${PLATFORM_QUEUE_WORKER_MAX_JOBS:-1000} & Q=$$!; php artisan schedule:work & S=$$!; trap 'kill $$Q $$S 2>/dev/null || true' INT TERM; while kill -0 $$Q 2>/dev/null && kill -0 $$S 2>/dev/null; do sleep 5; done; kill $$Q $$S 2>/dev/null || true; wait $$Q 2>/dev/null || true; wait $$S 2>/dev/null || true; exit 1"
    volumes:
      - platform_storage:/var/www/html/storage
      - platform_plugins:/var/www/html/plugins
      - platform_env:/var/www/html/.docker
    environment:
      APP_ENV: ${PLATFORM_APP_ENV:-production}
      APP_DEBUG: ${PLATFORM_APP_DEBUG:-false}
      PLATFORM_APP_URL: ${PLATFORM_APP_URL:-http://localhost}
      PLATFORM_WEBHOOK_PUBLIC_URL: ${PLATFORM_WEBHOOK_PUBLIC_URL:-}
      APP_INSTALLED: ${PLATFORM_APP_INSTALLED:-true}
      APP_AUTO_MIGRATE: ${PLATFORM_APP_AUTO_MIGRATE:-false}
      DB_CONNECTION: ${PLATFORM_DB_CONNECTION:-pgsql}
      DB_HOST: ${PLATFORM_DB_HOST:-postgres}
      DB_PORT: ${PLATFORM_DB_PORT:-5432}
      DB_DATABASE: ${PLATFORM_DB_DATABASE:-platform}
      DB_USERNAME: ${PLATFORM_DB_USERNAME:-platform}
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-platform}
      CACHE_STORE: ${PLATFORM_CACHE_STORE:-file}
      QUEUE_CONNECTION: ${PLATFORM_QUEUE_CONNECTION:-database}
      SESSION_DRIVER: ${PLATFORM_SESSION_DRIVER:-file}
      PLATFORM_DOCKER: "true"
      PLATFORM_RUN_SETUP: "false"
      API_INBOUND_WEBHOOKS_ASYNC: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  platform_storage:
    driver: local
  platform_plugins:
    driver: local
  platform_env:
    driver: local
